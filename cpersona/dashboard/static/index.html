<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>CPersona Dashboard</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<!-- A layout in the manner of a notes app: a strip of view icons, a side panel with the
     directory, and tabs over the work area. -->
<div class="ribbon" role="toolbar" aria-orientation="vertical" aria-label="Views">
  <button class="nav" data-view="overview" data-title-t="overview"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="11" y="3" width="6" height="6" rx="1"/><rect x="3" y="11" width="6" height="6" rx="1"/><rect x="11" y="11" width="6" height="6" rx="1"/></svg><span class="n" id="n-overview" hidden></span></button>
  <button class="nav" data-view="memories" data-title-t="memories"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h12M4 10h12M4 15h8"/></svg><span class="n" id="n-memories" hidden></span></button>
  <button class="nav" data-view="graph" data-title-t="graph"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="14" r="2"/><circle cx="15" cy="14" r="2"/><circle cx="10" cy="5" r="2"/><path d="M6.2 12.4 8.9 6.7M13.8 12.4 11.1 6.7M7 14h6"/></svg></button>
  <button class="nav" data-view="episodes" data-title-t="episodes"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7"/><path d="M10 6v4l3 2"/></svg><span class="n" id="n-episodes" hidden></span></button>
  <button class="nav" data-view="entities" data-title-t="entities"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5V4h6.5l7.5 7.5-6.5 6.5z"/><circle cx="6.5" cy="7.5" r="1"/></svg><span class="n" id="n-entities" hidden></span></button>
  <span class="ribbon-gap"></span>
  <button class="rb" id="paletteBtn" data-title-t="palettePh"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3H5a2 2 0 0 0-2 2v2M13 3h2a2 2 0 0 1 2 2v2M7 17H5a2 2 0 0 1-2-2v-2M13 17h2a2 2 0 0 0 2-2v-2M7 10h6"/></svg></button>
</div>
<aside class="side">
  <div class="side-tabs" role="tablist">
    <button role="tab" class="st" data-side="tree" data-title-t="browse"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6a1 1 0 0 1 1-1h4l2 2h6a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></svg></button>
    <button role="tab" class="st" data-side="search" data-title-t="sideSearch"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="5.5"/><path d="m13.2 13.2 3.8 3.8"/></svg></button>
  </div>
  <div class="side-pane" id="sideTree">
    <div class="section-label" data-t="browse"></div>
    <div class="tree" id="tree" role="tree"></div>
  </div>
  <div class="side-pane" id="sideSearch" hidden>
    <div class="sq-row">
      <label class="search side-q"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="5.5"/><path d="m13.2 13.2 3.8 3.8"/></svg><input id="sideQ" type="search" autocomplete="off">
        <button class="sq-case" id="sqCase" aria-pressed="false" data-title-t="matchCase">Aa</button></label>
      <button class="rb" id="sqOpts" aria-expanded="false" aria-controls="sqSettings" data-title-t="searchSettings"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h7M15 6h1M4 14h1M9 14h7"/><circle cx="13" cy="6" r="2"/><circle cx="7" cy="14" r="2"/></svg></button>
    </div>
    <div class="sq-help" id="sqHelp" hidden></div>
    <div class="sq-settings" id="sqSettings" hidden></div>
    <div class="side-results" id="sideResults"></div>
  </div>
  <div class="vault">
    <div class="vault-name"><b>CPersona</b><span id="dbname"></span></div>
    <button class="rb" id="setBtn" aria-expanded="false" aria-controls="settings" data-title-t="settings"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="2.5"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/></svg></button>
  </div>
  <div class="settings" id="settings" hidden>
    <label><input type="checkbox" id="techAlways"> <span data-t="techAlways"></span></label>
    <label data-title-t="calmDotsHint"><input type="checkbox" id="calmDots"> <span data-t="calmDots"></span></label>
    <div><span class="seg" role="group" aria-label="Language"><button data-lang="en">EN</button><button data-lang="ja">日本語</button></span></div>
    <div class="kbd" id="kbd"></div>
    <div class="hint" id="schemaLine"></div>
  </div>
</aside>
<div class="work">
  <div class="tabbar" role="tablist" id="tabbar"></div>
  <div class="navbar">
    <button class="rb" id="backBtnTab" data-title-t="back"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 6 10l6 6"/></svg></button>
    <button class="rb" id="fwdBtnTab" data-title-t="forward"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m8 4 6 6-6 6"/></svg></button>
    <span class="nav-title" id="navTitle"></span>
  </div>
  <main id="main"><div class="page" id="page"></div></main>
</div>
<div class="palette-bg" id="paletteBg"><div class="palette" role="dialog" aria-label="Search">
  <input id="paletteInput" autocomplete="off"><ul id="paletteList"></ul>
</div></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
