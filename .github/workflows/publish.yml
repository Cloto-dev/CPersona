name: Publish to PyPI

# Publishes cpersona to PyPI via OIDC Trusted Publishing (no stored token).
#
# Trigger: a `vX.Y.Z` tag push (the release cut), or manual dispatch against an
# already-existing tag (lets us publish a previously-cut tag without retagging —
# e.g. a tag pushed before this workflow existed).
#
# Guardrail: the tag version and pyproject.toml version must agree, or the run
# fails loud before building — a mistyped tag can never publish a mismatched
# artifact.
#
# Test gate: the upload job needs the `test` job, which runs the suite on the
# very commit the tag names. Nothing upstream can be relied on to have done it:
# a maintenance line (2.4.x, 2.5.x) takes backports and version bumps by direct
# push, and a master run can be cancelled by the push that follows it. A wheel
# on PyPI cannot be replaced once uploaded, so the check that it works happens
# here, before the upload, not in a run that may never have finished.
#
# Authentication: OIDC Trusted Publishing. PyPI must have a trusted publisher
# registered for this project (owner Cloto-dev, repo CPersona, workflow
# publish.yml, environment pypi). No PYPI_API_TOKEN secret is stored anywhere.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v2.4.35). Must already point at the commit to ship.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    # One answer to "which commit is being released", read by both jobs below,
    # so the commit tested and the commit uploaded cannot differ.
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      tag_version: ${{ steps.ref.outputs.tag_version }}
    steps:
      - name: Resolve target ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${TAG}" >> "$GITHUB_OUTPUT"
            echo "tag_version=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "tag_version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi
        env:
          TAG: ${{ inputs.tag }}

  test:
    needs: resolve
    runs-on: ubuntu-latest
    # Same ceiling as the CI test job: the suite finishes in seconds, so
    # anything past 15 minutes is a hang.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Ruff
        run: uvx ruff@0.15.21 check .
      - name: Verify issue registry
        run: bash scripts/verify-issues.sh
      - name: Sync dependencies (incl. test toolchain)
        # --locked, as in ci.yml: the suite runs against the lock the release ships.
        run: uv sync --locked --dev --python ${{ matrix.python-version }}
      - name: Run tests
        run: uv run pytest

  publish:
    needs: [resolve, test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cpersona
    permissions:
      id-token: write # OIDC token for Trusted Publishing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Verify tag version matches the package
        # Reads cpersona/__init__.py, which is where the version lives as of 2.5.8:
        # pyproject declares `dynamic = ["version"]` and hatch derives it from there,
        # so the literal this step used to grep out of pyproject no longer exists.
        # It resolved to the empty string and failed every publish — correctly, but
        # for the wrong reason. An empty match must stay a failure rather than
        # comparing "" to "": grep exits non-zero under `bash -e` when it matches
        # nothing, and the explicit emptiness check covers a match with no capture.
        run: |
          source_version=$(grep -m1 '^__version__ = ' cpersona/__init__.py | sed -E 's/__version__ = "(.*)"/\1/')
          tag_version="$TAG_VERSION"
          if [ -z "$source_version" ]; then
            echo "::error::could not read __version__ from cpersona/__init__.py — this guard is broken, not the tag"
            exit 1
          fi
          if [ "$source_version" != "$tag_version" ]; then
            echo "::error::tag version '$tag_version' does not match package version '$source_version'"
            exit 1
          fi
          echo "version match: $source_version"
        env:
          TAG_VERSION: ${{ needs.resolve.outputs.tag_version }}

      - name: Build sdist + wheel
        run: uv build

      - name: Publish to PyPI (OIDC Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
