name: docs

# Builds the mkdocs-material site from docs/ and deploys it to GitHub Pages.
# docs/ is the canonical documentation surface (README and the bundled skill
# hold pointers, not bodies), so a broken build here means the canonical
# surface is unpublishable — the build job therefore runs --strict (broken
# internal links and nav references fail the build) and gates PRs that touch
# the docs. Deployment happens only on push to master.

on:
  # Both lists are spelled out because GitHub Actions does not resolve YAML
  # anchors — keep them in step.  The scripts/ entries are on the trigger so
  # that a PR editing a doc checker actually runs the checker it edited; every
  # checker the build job runs belongs here, or editing it is the one change
  # that cannot be tested.  overrides/ is on the trigger because it IS the
  # language-routing implementation (theme.custom_dir), not decoration: a PR
  # that only touches it would otherwise ship an unrun check-lang-routing.js,
  # and — because push is filtered by the same list — master would not
  # redeploy Pages either, leaving the regression latent until an unrelated
  # docs/ edit carried it out.
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "overrides/**"
      - ".github/workflows/docs.yml"
      - "scripts/check-doc-anchors.py"
      - "scripts/check-docs-index.py"
      - "scripts/check-mermaid.mjs"
      - "scripts/check-heading-parity.py"
      - "scripts/check-i18n-coverage.py"
      - "scripts/check-i18n-drift.py"
      - "scripts/check-lang-routing.js"
      - "scripts/translate-i18n-drift.py"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "overrides/**"
      - ".github/workflows/docs.yml"
      - "scripts/check-doc-anchors.py"
      - "scripts/check-docs-index.py"
      - "scripts/check-mermaid.mjs"
      - "scripts/check-heading-parity.py"
      - "scripts/check-i18n-coverage.py"
      - "scripts/check-i18n-drift.py"
      - "scripts/check-lang-routing.js"
      - "scripts/translate-i18n-drift.py"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The translation updater diffs the current English page against the
          # blob its translation recorded. A shallow clone does not have that
          # blob, and the updater refuses to fall back to a full re-translation
          # — so without history the job reports and stops instead of working.
          fetch-depth: 0
      - name: Documentation index coverage (blocking)
        # Runs before the build because it reads the sources, and because the
        # thing it catches is cheap to catch early. mkdocs logs a page that is
        # missing from `nav:` at INFO, which --strict does not promote, and
        # nothing at all watched docs/llms.txt — the machine-readable index had
        # silently fallen six pages behind when this step was written. Every
        # other docs gate starts from a page it was handed, so a page no index
        # points at is not an input to any of them.
        run: python3 scripts/check-docs-index.py
      - name: Diagram sources parse (blocking)
        # mkdocs turns a ```mermaid block into <pre class="mermaid"> and stops;
        # the parser runs in the reader's browser. A broken diagram therefore
        # builds green and renders nothing. Installed here rather than carried
        # as a committed dependency because it is only ever run by this step.
        run: |
          npm install --no-save --no-audit --no-fund mermaid@11.17.2 jsdom@30.0.1
          node scripts/check-mermaid.mjs docs
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Build site (strict)
        # Pinned for reproducibility, same policy as the lint job in ci.yml.
        run: uvx --with mkdocs-material==9.7.7 --with mkdocs-static-i18n==1.3.1 mkdocs build --strict
      - name: In-site anchor links (blocking)
        # --strict fails on a broken page link but passes a broken #fragment,
        # so a translated heading can invalidate every link aimed at its
        # English slug and still build green. Measured on this repo: stripping
        # the explicit ids from one translated page left --strict at exit 0
        # while breaking 16 links across four pages. This step is the detector
        # for that class, and it runs against the built site, not the sources.
        run: python3 scripts/check-doc-anchors.py site
      - name: Translated heading anchors (blocking)
        # The anchor check above asks whether the links that exist resolve, so a
        # translated page whose heading ids have all moved stays green until
        # somebody links to one of them. Measured here: index.ja.md and
        # faq.ja.md carried no explicit ids at all — 16 headings answering to
        # `_1`, `3`, `ai`, `recall_1` — with every gate green. This step
        # compares each translated page's heading ids against its English
        # source, so the breakage is caught when it is written rather than when
        # it is first linked.
        run: python3 scripts/check-heading-parity.py site
      - name: Language routing (blocking)
        # GitHub Pages cannot negotiate on Accept-Language, so the routing lives
        # in the page head (overrides/main.html) and mkdocs --strict cannot see
        # whether it works: the template can render a syntactically perfect
        # script pointing at the wrong pages. Measured while writing it — reading
        # config.extra.alternate without Material's `url` filter left every page
        # except the site root redirecting into a 404, with a green build. This
        # step checks the destinations against each page's own hreflang links and
        # executes the script against a stubbed DOM for the cases that only go
        # wrong later: the redirect loop, the overridden choice, private mode.
        run: node scripts/check-lang-routing.js site
      - name: Japanese translation drift (blocking)
        # English is canonical; a ja page records the English content it was
        # translated from. Advisory was the wrong setting for a published
        # site: an English edit shipped on its own left /ja/ serving the
        # previous contract with nothing red anywhere, which is worse than an
        # English fallback because the reader cannot tell.
        #
        # Escape hatch: label a PR `i18n-defer` to drop back to advisory for
        # that PR. It exists for changes that cannot carry their translation —
        # a fork PR, where secrets and write access are unavailable, is the
        # case this repository will hit first.
        env:
          DEFER: ${{ contains(github.event.pull_request.labels.*.name, 'i18n-defer') }}
        run: |
          if [ "$DEFER" = "true" ]; then
            echo "::notice::i18n-defer label present — reporting drift without failing"
            python3 scripts/check-i18n-drift.py
          else
            python3 scripts/check-i18n-drift.py --strict
          fi
      - name: Japanese translation coverage (blocking)
        # The drift check above walks docs/*.ja.md, so it can only ask whether an
        # existing translation is current. A page with no translation is not
        # walked and is not a finding there — English fallback is by design. This
        # step covers the other half: a page must carry a translation or declare
        # in docs/.i18n-english-only that it stays English, and every nav label
        # must have a nav_translations entry (a missing one does not fail the
        # build, it renders English into the Japanese nav). Measured here:
        # docs/quality-assurance.md shipped with neither and every gate was green.
        run: python3 scripts/check-i18n-coverage.py --strict
      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  # Draft the missing translation on the same branch, so the blocking check above
  # has something to go green against.
  #
  # Three constraints shaped this, all learned the hard way elsewhere:
  #
  #   * It pushes to the PR's own branch, never a second PR. The i18n check is
  #     blocking, so a fix that arrives as a separate PR leaves the original red
  #     and waiting on a merge that is waiting on it.
  #   * It pushes with a PAT, not GITHUB_TOKEN. A commit pushed with GITHUB_TOKEN
  #     does not trigger workflows, so the blocking check would never re-run and
  #     the PR would sit red forever with a green fix already committed to it.
  #     The symptom is "the check just never updates", which reads as a hung
  #     runner rather than a token policy.
  #   * It never merges. No gate here reads meaning: a translation that reverses
  #     a MUST, drops a negation, or quietly changes a threshold passes the
  #     anchor check, the drift check, and the site build. What is automated is
  #     the first draft; the fidelity review against the English is a person's.
  translate:
    if: >-
      !cancelled() &&
      github.event_name == 'pull_request' &&
      needs.build.result == 'failure' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.labels.*.name, 'i18n-defer')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check that the credentials exist
        id: creds
        env:
          HAS_KEY: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          HAS_TOKEN: ${{ secrets.I18N_SYNC_TOKEN != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ] || [ "$HAS_TOKEN" != "true" ]; then
            # A warning, not a notice: this job goes green when it is not
            # configured, so an unconfigured run and a run with nothing to do
            # look identical in the checks list. Observed during setup — a
            # secret that had been set to an empty string read as "configured"
            # at a glance, because the job was green and the notice sat in a
            # collapsed log. A warning is surfaced on the run summary.
            echo "::warning::Automatic translation is not configured (CLAUDE_CODE_OAUTH_TOKEN / I18N_SYNC_TOKEN). Re-sync docs/*.ja.md by hand, or label this PR i18n-defer."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.configured == 'true'
        with:
          # The PAT is what makes the pushed commit re-trigger this workflow.
          token: ${{ secrets.I18N_SYNC_TOKEN }}
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
      - name: Install uv
        if: steps.creds.outputs.configured == 'true'
        uses: astral-sh/setup-uv@v5
      - name: Install Claude Code
        if: steps.creds.outputs.configured == 'true'
        # Pinned like every other tool this workflow runs. The npm package ships
        # the same native binary as the standalone installer — Node is used to
        # place it, not to run it.
        run: npm install -g @anthropic-ai/claude-code@2.1.240
      - name: Draft the missing translations
        if: steps.creds.outputs.configured == 'true'
        # Subscription auth, not an API key: the token is what `claude
        # setup-token` mints, and the work is billed to the subscription rather
        # than per-token. It can only make model requests, which is all this
        # needs.
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python3 scripts/translate-i18n-drift.py
      - name: Verify the result the same way a human edit is verified
        if: steps.creds.outputs.configured == 'true'
        run: |
          python3 scripts/check-i18n-drift.py --strict
          uvx --with mkdocs-material==9.7.7 --with mkdocs-static-i18n==1.3.1 mkdocs build --strict
          python3 scripts/check-doc-anchors.py site
          python3 scripts/check-heading-parity.py site
      - name: Commit to the PR branch
        if: steps.creds.outputs.configured == 'true'
        run: |
          if [ -z "$(git status --porcelain -- docs/)" ]; then
            echo "::notice::No translation changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          # Two -m flags rather than one multi-line string: a YAML block scalar
          # strips only the common indent, so a body indented past `run:` keeps
          # the extra spaces on every line of the commit message.
          git commit \
            -m "docs: draft the Japanese side of this change" \
            -m "Generated from the English diff of this branch. The wording is a first draft: read it against the English before merging. No automated gate here reads meaning, so a reversed MUST or a dropped negation passes every check."
          git push

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
