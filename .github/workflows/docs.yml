name: docs

# Builds the mkdocs-material site from docs/ and deploys it to GitHub Pages.
# docs/ is the canonical documentation surface (README and the bundled skill
# hold pointers, not bodies), so a broken build here means the canonical
# surface is unpublishable — the build job therefore runs --strict (broken
# internal links and nav references fail the build) and gates PRs that touch
# the docs. Deployment happens only on push to master.

on:
  # Both lists are spelled out because GitHub Actions does not resolve YAML
  # anchors — keep them in step.  The scripts/ entries are on the trigger so
  # that a PR editing a doc checker actually runs the checker it edited.
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
      - "scripts/check-doc-anchors.py"
      - "scripts/check-i18n-drift.py"
      - "scripts/translate-i18n-drift.py"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
      - "scripts/check-doc-anchors.py"
      - "scripts/check-i18n-drift.py"
      - "scripts/translate-i18n-drift.py"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The translation updater diffs the current English page against the
          # blob its translation recorded. A shallow clone does not have that
          # blob, and the updater refuses to fall back to a full re-translation
          # — so without history the job reports and stops instead of working.
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Build site (strict)
        # Pinned for reproducibility, same policy as the lint job in ci.yml.
        run: uvx --with mkdocs-material==9.7.7 --with mkdocs-static-i18n==1.3.1 mkdocs build --strict
      - name: In-site anchor links (blocking)
        # --strict fails on a broken page link but passes a broken #fragment,
        # so a translated heading can invalidate every link aimed at its
        # English slug and still build green. Measured on this repo: stripping
        # the explicit ids from one translated page left --strict at exit 0
        # while breaking 16 links across four pages. This step is the detector
        # for that class, and it runs against the built site, not the sources.
        run: python3 scripts/check-doc-anchors.py site
      - name: Japanese translation drift (blocking)
        # English is canonical; a ja page records the English content it was
        # translated from. Advisory was the wrong setting for a published
        # site: an English edit shipped on its own left /ja/ serving the
        # previous contract with nothing red anywhere, which is worse than an
        # English fallback because the reader cannot tell.
        #
        # Escape hatch: label a PR `i18n-defer` to drop back to advisory for
        # that PR. It exists for changes that cannot carry their translation —
        # a fork PR, where secrets and write access are unavailable, is the
        # case this repository will hit first.
        env:
          DEFER: ${{ contains(github.event.pull_request.labels.*.name, 'i18n-defer') }}
        run: |
          if [ "$DEFER" = "true" ]; then
            echo "::notice::i18n-defer label present — reporting drift without failing"
            python3 scripts/check-i18n-drift.py
          else
            python3 scripts/check-i18n-drift.py --strict
          fi
      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  # Draft the missing translation on the same branch, so the blocking check above
  # has something to go green against.
  #
  # Three constraints shaped this, all learned the hard way elsewhere:
  #
  #   * It pushes to the PR's own branch, never a second PR. The i18n check is
  #     blocking, so a fix that arrives as a separate PR leaves the original red
  #     and waiting on a merge that is waiting on it.
  #   * It pushes with a PAT, not GITHUB_TOKEN. A commit pushed with GITHUB_TOKEN
  #     does not trigger workflows, so the blocking check would never re-run and
  #     the PR would sit red forever with a green fix already committed to it.
  #     The symptom is "the check just never updates", which reads as a hung
  #     runner rather than a token policy.
  #   * It never merges. No gate here reads meaning: a translation that reverses
  #     a MUST, drops a negation, or quietly changes a threshold passes the
  #     anchor check, the drift check, and the site build. What is automated is
  #     the first draft; the fidelity review against the English is a person's.
  translate:
    if: >-
      !cancelled() &&
      github.event_name == 'pull_request' &&
      needs.build.result == 'failure' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.labels.*.name, 'i18n-defer')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check that the credentials exist
        id: creds
        env:
          HAS_KEY: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          HAS_TOKEN: ${{ secrets.I18N_SYNC_TOKEN != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ] || [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice::Automatic translation is not configured (CLAUDE_CODE_OAUTH_TOKEN / I18N_SYNC_TOKEN). Re-sync docs/*.ja.md by hand, or label this PR i18n-defer."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.configured == 'true'
        with:
          # The PAT is what makes the pushed commit re-trigger this workflow.
          token: ${{ secrets.I18N_SYNC_TOKEN }}
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
      - name: Install uv
        if: steps.creds.outputs.configured == 'true'
        uses: astral-sh/setup-uv@v5
      - name: Install Claude Code
        if: steps.creds.outputs.configured == 'true'
        # Pinned like every other tool this workflow runs. The npm package ships
        # the same native binary as the standalone installer — Node is used to
        # place it, not to run it.
        run: npm install -g @anthropic-ai/claude-code@2.1.240
      - name: Draft the missing translations
        if: steps.creds.outputs.configured == 'true'
        # Subscription auth, not an API key: the token is what `claude
        # setup-token` mints, and the work is billed to the subscription rather
        # than per-token. It can only make model requests, which is all this
        # needs.
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python3 scripts/translate-i18n-drift.py
      - name: Verify the result the same way a human edit is verified
        if: steps.creds.outputs.configured == 'true'
        run: |
          python3 scripts/check-i18n-drift.py --strict
          uvx --with mkdocs-material==9.7.7 --with mkdocs-static-i18n==1.3.1 mkdocs build --strict
          python3 scripts/check-doc-anchors.py site
      - name: Commit to the PR branch
        if: steps.creds.outputs.configured == 'true'
        run: |
          if [ -z "$(git status --porcelain -- docs/)" ]; then
            echo "::notice::No translation changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          # Two -m flags rather than one multi-line string: a YAML block scalar
          # strips only the common indent, so a body indented past `run:` keeps
          # the extra spaces on every line of the commit message.
          git commit \
            -m "docs: draft the Japanese side of this change" \
            -m "Generated from the English diff of this branch. The wording is a first draft: read it against the English before merging. No automated gate here reads meaning, so a reversed MUST or a dropped negation passes every check."
          git push

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
