name: docs

# Builds the mkdocs-material site from docs/ and deploys it to GitHub Pages.
# docs/ is the canonical documentation surface (README and the bundled skill
# hold pointers, not bodies), so a broken build here means the canonical
# surface is unpublishable — the build job therefore runs --strict (broken
# internal links and nav references fail the build) and gates PRs that touch
# the docs. Deployment happens only on push to master.

on:
  push:
    branches: [master]
    paths: ["docs/**", "mkdocs.yml", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "mkdocs.yml", ".github/workflows/docs.yml"]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Build site (strict)
        # Pinned for reproducibility, same policy as the lint job in ci.yml.
        run: uvx --with mkdocs-material==9.7.7 mkdocs build --strict
      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
