name: CI

# Runs the full test suite on every PR and every push to master. This is the hard gate
# the project previously lacked: the suite was run by hand (and rarely), which is how
# embedding-path regressions reached production. The suite is hermetic and bounded
# (see conftest.py + [tool.pytest.ini_options] in pyproject.toml), so it needs no
# embedding server and cannot hang.

on:
  push:
    branches: [master]
  pull_request:
  # Every job below except wheel-smoke resolves dependencies from uv.lock, so an
  # upstream release that breaks one of this package's requirements is invisible
  # to them by construction. wheel-smoke is the only job that resolves the way a
  # user installing from PyPI does — and it runs on push, which means a quiet
  # repository stops checking exactly when it can no longer fix the problem: a
  # published wheel's `requires_dist` cannot be edited after the fact. Weekly, so
  # the delay between "upstream broke the install" and "we know" is bounded by
  # the calendar instead of by commit cadence. (Scheduled workflows are disabled
  # by GitHub after 60 days without repository activity; that is acceptable here,
  # since a repository nobody touches for 60 days is also not shipping wheels.)
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # 2.5.0b1: the pre-b1 audit found lint drift that had accumulated invisibly
    # because CI ran pytest only — ruff is now a gate alongside the suite.
    #
    # Skipped on the weekly schedule: this job (like verify-issues, test and
    # mutation-proof below) reads a pinned toolchain and a locked dependency
    # set, so a scheduled run re-answers a question already answered on the
    # last push. Only wheel-smoke resolves unlocked, and that is the whole
    # point of the schedule — see the trigger block above.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Ruff
        run: uvx ruff@0.15.21 check .

  verify-issues:
    # bug-122 (2.5.0b1 audit C02): the issue registry is the regression contract —
    # 113+ documented patterns pinned to files. It was verified only by hand, so a
    # refactor could silently strip a fix marker (stale pin) without CI noticing.
    if: github.event_name != 'schedule'  # locked/pinned — see lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify issue registry
        run: bash scripts/verify-issues.sh
      - name: Verify mutation-waiver registry
        # Registry-integrity check (stdlib-only, so no uv
        # sync). Fails only on a MALFORMED registry (hard problems); expiry and
        # code-drift are advisory until L6 (#299) turns on --strict.
        run: python3 scripts/mutation_waivers.py

  test:
    if: github.event_name != 'schedule'  # locked/pinned — see lint
    runs-on: ubuntu-latest
    # bug-124: the full suite finishes in seconds; a leaked non-daemon thread once
    # kept the step alive to the 6-HOUR default job limit (burning runner time and
    # masking the failure as "cancelled"). Anything past 15 minutes is a hang.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies (incl. test toolchain)
        run: uv sync --dev --python ${{ matrix.python-version }}
      - name: Run tests
        run: uv run pytest

  docs-facts:
    # Goal: hand-written numbers in current-state docs (README, the bundled
    # skill, docs/ canonical pages) must match what the code measures. The
    # bundled skill shipped "28 tools / ~5,600 LOC" for months after both had
    # grown — a production user caught it before CI did. The checker compares
    # tool count (runtime registry), schema version, env-var defaults
    # (config.py parse vs every doc table), and rounded volatile stats
    # (LOC / test counts, 3% drift tolerance). Design docs are exempt
    # (point-in-time records).
    if: github.event_name != 'schedule'  # locked/pinned — see lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The release-freshness check reads `git tag`, and the default
          # shallow checkout carries none. The check fails loudly rather than
          # skipping when it sees no tags, so without this the job is red, not
          # quietly blind — but red for the wrong reason.
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies (pytest needed for case collection)
        run: uv sync --dev --python 3.13
      - name: Check docs facts against source
        run: uv run python scripts/check-docs-facts.py

  wheel-smoke:
    # bug-181: the wheel no longer ships the vendored modules nothing imports.
    # That exclusion is decided in pyproject and checked statically by Gate 13 in
    # the suite, but neither of those installs the artifact — and the failure mode
    # of getting it wrong (an excluded module that IS imported) appears only on a
    # user's machine, as an ImportError, at first use. So this job builds the
    # wheel, installs it into a clean environment with no repository on the path,
    # and imports the server for real.
    #
    # 2.5.8: it also holds the half of the version claim the suite cannot. Gate 18
    # checks the hand-written manifests against cpersona/__init__.py, but the
    # distribution's metadata is *derived* from that file by the build, and only an
    # installed artifact can show the derivation actually took. Getting it wrong is
    # again invisible where it happens — a production instance was measured
    # reporting a version four releases behind the code serving its requests.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build the wheel
        run: uv build --wheel -o dist
      - name: Install it into a clean environment
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
      - name: Import the installed package (never from the checkout)
        env:
          CPERSONA_EMBEDDING_MODE: none
          CPERSONA_DB_PATH: /tmp/smoke/smoke.db
        # cd /tmp so `import cpersona` cannot resolve to the source tree.
        run: |
          cd /tmp
          /tmp/smoke/bin/python -c "
          import pathlib
          import cpersona, cpersona.server, cpersona.checks, cpersona.checkup
          import cpersona.memory_handlers, cpersona.admin_handlers, cpersona.maintenance_handlers
          vendored = pathlib.Path(cpersona.__file__).parent / '_vendored_mcp_common'
          shipped = sorted(p.name for p in vendored.glob('*.py'))
          print('shipped vendored modules:', shipped)
          assert 'llm_provider.py' not in shipped, 'the exclusion did not take effect'
          print('checks registered:', len(cpersona.checks.HEALTH_CHECK_NAMES))
          import importlib.metadata
          installed = importlib.metadata.version('cpersona')
          reported = cpersona.maintenance_handlers._server_version()
          print('dist metadata:', installed, '| __version__:', cpersona.__version__, '| reported:', reported)
          assert installed == cpersona.__version__, (
              'the wheel metadata (%s) and the package source (%s) disagree — the '
              'hatch version derivation did not take' % (installed, cpersona.__version__)
          )
          assert reported == cpersona.__version__, (
              'the server reports %s while running %s' % (reported, cpersona.__version__)
          )
          "

  mutation-proof:
    # First increment: the 2.5.2 refactor seams are guarded by
    # scripts/mutation-proof.py, which applies each hand-authored mutation, runs
    # the suite, and asserts the mutant is CAUGHT (or is a documented equivalent
    # mutant). A green suite is not evidence it would go RED on a real regression;
    # this job turns that evidence into a gate. The behaviour-golden differential
    # (scripts/capture-behaviour.py) is already gated by the `test` job — it runs
    # as tests/test_equivalence_252.py under pytest — so it needs no step here.
    #
    # Pinned to 3.13 only to bound cost: the mutations exercise handler logic, not
    # stdlib version edges, so a second Python version would add runtime without
    # adding signal.
    if: github.event_name != 'schedule'  # locked/pinned — see lint
    runs-on: ubuntu-latest
    # The script runs the suite up to ~13 times, but caught mutants fail fast (-x)
    # and every test is bounded by the 60s per-test timeout; local wall time is
    # ~12s. 15 minutes is a generous hang ceiling, matching the `test` job.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies (incl. test toolchain)
        run: uv sync --dev --python 3.13
      - name: Mutation proof (2.5.2 refactor seams)
        run: uv run --frozen python scripts/mutation-proof.py

  mutation-diff:
    # Lane L1: ADVISORY, non-blocking mutation testing scoped
    # to the PR's production diff (cosmic-ray + cr-filter-git). It NEVER fails the
    # build — the script always exits 0 and continue-on-error is a second belt —
    # because this lane exists to MEASURE (survivor counts, noise rate, added CI
    # time), not to gate. The blocking flip is a later, deliberate decision (#299
    # / L6) fed by these numbers. Distinct from the mutation-proof job above,
    # which runs hand-authored sentinel mutants and IS blocking.
    #
    # PR-only: a push to master has no meaningful diff base here, and the git
    # filter needs the base branch to scope against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    # cosmic-ray runs the suite once per in-scope mutant; the diff scope + the
    # --cap in the script bound that. 20 minutes is a generous hang ceiling.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the git filter can diff against the base branch.
          fetch-depth: 0
      - name: Ensure base ref is present
        run: git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies (test toolchain + cosmic-ray)
        run: uv sync --group dev --group mutation --python 3.13
      - name: Mutation-diff (advisory)
        env:
          MUTATION_DIFF_BASE: origin/${{ github.base_ref }}
        run: uv run python scripts/mutation-diff.py --json-out mutation-diff-report.json
      - name: Say so when the measurement did not happen
        # The lane is advisory, so its step cannot fail the build — which is
        # correct, and is also why a run killed by the ceiling above says nothing
        # at all. Then "measured and found nothing" and "never measured" read the
        # same on the PR. This step runs even when the previous one was cancelled
        # and writes the distinction into the summary the reader actually sees.
        if: always()
        run: |
          if [ -f mutation-diff-report.json ]; then
            reported=$(python3 -c "import json;print(json.load(open('mutation-diff-report.json'))['status'])")
            echo "mutation-diff reported: $reported"
          else
            {
              echo "## Mutation-diff (advisory)"
              echo
              echo "**status:** \`did-not-complete\` — no report was written, so this lane measured"
              echo "nothing on this commit. The usual cause is the job's timeout killing the run"
              echo "mid-execution. Treat it as unmeasured, not as clean."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "mutation-diff produced no report — unmeasured, not clean."
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-diff-report
          path: mutation-diff-report.json
          if-no-files-found: warn

  container:
    # The container path was a file nobody executed. It shipped for five months
    # with `CMD ["python", "server.py"]` under a transport that defaults to
    # stdio, so the image bound nothing while EXPOSE named a port the server does
    # not use; there was no volume, so the database of a *persistent memory*
    # server died with the container; and `COPY . .` with no .dockerignore put
    # the git history and a local virtualenv inside the image. None of that is
    # hard to get right. What made it wrong for five months is that no gate ever
    # ran it, and a corrected Dockerfile with no gate is the same file with a
    # later date on it.
    #
    # So this job does not lint the Dockerfile. It builds the image, starts it,
    # and asks the questions a user would: does it refuse to serve without a
    # token, does it answer through a published port, does what I store survive
    # the container being destroyed.
    #
    # CPERSONA_UPDATE_CHECK is off in every run below. The server asks pypi.org
    # for a newer release at startup, and a gate that reaches a third party is a
    # gate that goes red for reasons that are not about this commit.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE: cpersona:ci
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t "$IMAGE" .

      - name: The build context carries only the wheel's inputs
        # .dockerignore is an allowlist, and an allowlist that stops matching
        # fails by admitting more rather than by erroring. These three are what
        # the previous `COPY . .` put in the image and what nothing at runtime
        # needs, so their absence is the readable form of "the context is still
        # scoped".
        run: |
          set -euo pipefail
          # Not named `path`: in zsh that identifier is tied to PATH, and
          # assigning to it empties the command search path. This block runs
          # under bash, where it is an ordinary name -- but the same loop was
          # written by hand in a zsh shell first, where it made `docker` itself
          # not-found and every check "pass".
          for entry in /.git /app /src; do
            if docker run --rm --entrypoint sh "$IMAGE" -c "test -e $entry"; then
              echo "::error::$entry exists in the image — the build context admitted more than the wheel's inputs"
              exit 1
            fi
          done
          echo "no repository tree in the image"

      - name: It refuses to serve HTTP without a token
        # The server's own guard: a published container port forwards to whatever
        # the process bound, so binding inside the container is not evidence that
        # only the container can reach it. An image that starts here is an image
        # serving every tool -- delete_agent_data included -- to whoever reaches
        # the port.
        run: |
          # `run:` is `bash -e`, and this is the one step whose command is
          # SUPPOSED to fail. Setting -u/-o here does not clear the -e the shell
          # was invoked with, so a bare `docker run` on its own line ends the step
          # before `$?` is ever read -- and the step then fails with no message,
          # which reads as the refusal being broken rather than working. Capture
          # the status on the same line as the command that produces it.
          set -uo pipefail
          started=0
          docker run --rm -e CPERSONA_UPDATE_CHECK=false "$IMAGE" > /tmp/refusal.txt 2>&1 || started=$?
          if [ "$started" -eq 0 ]; then
            echo "::error::the container served HTTP with no CPERSONA_AUTH_TOKEN"
            cat /tmp/refusal.txt
            exit 1
          fi
          if ! grep -q "CPERSONA_AUTH_TOKEN" /tmp/refusal.txt; then
            echo "::error::it exited $started, but not with the token refusal — the failure is a different one"
            cat /tmp/refusal.txt
            exit 1
          fi
          echo "refused, and said why"

      - name: It serves, and only to a caller carrying the token
        run: |
          set -euo pipefail
          docker volume create cpersona-ci > /dev/null
          docker run -d --name cp-ci -p 18402:8402 \
            -e CPERSONA_AUTH_TOKEN=ci-token -e CPERSONA_UPDATE_CHECK=false \
            -v cpersona-ci:/data "$IMAGE" > /dev/null
          ./.github/scripts/wait-for-healthy.sh cp-ci
          uid=$(docker exec cp-ci id -u)
          if [ "$uid" != "10001" ]; then
            echo "::error::the server runs as uid $uid, expected the unprivileged 10001"
            exit 1
          fi
          anon=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18402/mcp \
                 -H 'Content-Type: application/json' -d '{}' --max-time 10)
          if [ "$anon" != "401" ]; then
            echo "::error::an anonymous request got $anon, expected 401"
            exit 1
          fi
          echo "healthy, uid 10001, anonymous request refused"

      - name: What it stores outlives the container that wrote it
        # The claim the old image could not make. A row written through the API,
        # the container destroyed, and the row read back by a different container
        # from the same volume -- because "persistent memory" that lasts as long
        # as one container process is the product's opposite.
        #
        # Read back with list_memories rather than recall: recall ranks, and this
        # image has no embedding backend, so a ranked read would be asking two
        # questions and reporting one answer.
        run: |
          set -euo pipefail
          ./.github/scripts/mcp-call.sh store \
            '{"agent_id":"ci","message":{"content":"the volume claim is what this row tests","source":{"type":"User","id":"ci"}}}' \
            > /tmp/stored.txt
          if ! grep -Fq '\"result\": \"stored\"' /tmp/stored.txt; then
            echo "::error::the store did not report a written row"
            cat /tmp/stored.txt
            exit 1
          fi
          docker rm -f cp-ci > /dev/null
          docker run -d --name cp-ci-again -p 18402:8402 \
            -e CPERSONA_AUTH_TOKEN=ci-token -e CPERSONA_UPDATE_CHECK=false \
            -v cpersona-ci:/data "$IMAGE" > /dev/null
          ./.github/scripts/wait-for-healthy.sh cp-ci-again
          ./.github/scripts/mcp-call.sh list_memories '{"agent_id":"ci","limit":5}' > /tmp/listed.txt
          if ! grep -Fq "the volume claim is what this row tests" /tmp/listed.txt; then
            echo "::error::the row did not survive — the volume is not holding the database"
            cat /tmp/listed.txt
            exit 1
          fi
          echo "the row outlived the container that wrote it"

      - name: The stdio transport answers too
        # The shape an MCP client spawns as a subprocess, and the documented
        # alternative to this image's HTTP default. Gated rather than described,
        # for the reason the whole job exists.
        run: |
          set -euo pipefail
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | docker run -i --name cp-ci-stdio \
                -e CPERSONA_TRANSPORT=stdio -e CPERSONA_DB_PATH=/tmp/stdio.db \
                -e CPERSONA_UPDATE_CHECK=false "$IMAGE" > /tmp/stdio.txt 2>/dev/null
          if ! grep -q '"protocolVersion"' /tmp/stdio.txt; then
            echo "::error::the stdio transport did not answer initialize"
            cat /tmp/stdio.txt
            exit 1
          fi
          echo "stdio answered initialize"
