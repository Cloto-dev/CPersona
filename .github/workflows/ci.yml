name: CI

# Runs the full test suite on every PR and every push to master. This is the hard gate
# the project previously lacked: the suite was run by hand (and rarely), which is how
# embedding-path regressions reached production. The suite is hermetic and bounded
# (see conftest.py + [tool.pytest.ini_options] in pyproject.toml), so it needs no
# embedding server and cannot hang.

on:
  push:
    branches: [master]
  pull_request:
  # Every job below except wheel-smoke resolves dependencies from uv.lock, so an
  # upstream release that breaks one of this package's requirements is invisible
  # to them by construction. wheel-smoke is the only job that resolves the way a
  # user installing from PyPI does — and it runs on push, which means a quiet
  # repository stops checking exactly when it can no longer fix the problem: a
  # published wheel's `requires_dist` cannot be edited after the fact. Weekly, so
  # the delay between "upstream broke the install" and "we know" is bounded by
  # the calendar instead of by commit cadence. (Scheduled workflows are disabled
  # by GitHub after 60 days without repository activity; that is acceptable here,
  # since a repository nobody touches for 60 days is also not shipping wheels.)
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # 2.5.0b1: the pre-b1 audit found lint drift that had accumulated invisibly
    # because CI ran pytest only — ruff is now a gate alongside the suite.
    #
    # Skipped on the weekly schedule: this job (like verify-issues, test and
    # mutation-proof below) reads a pinned toolchain and a locked dependency
    # set, so a scheduled run re-answers a question already answered on the
    # last push. Only wheel-smoke resolves unlocked, and that is the whole
    # point of the schedule — see the trigger block above.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Ruff
        run: uvx ruff@0.15.21 check .

  verify-issues:
    # bug-122 (2.5.0b1 audit C02): the issue registry is the regression contract —
    # 113+ documented patterns pinned to files. It was verified only by hand, so a
    # refactor could silently strip a fix marker (stale pin) without CI noticing.
    if: github.event_name != 'schedule'  # locked/pinned — see lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify issue registry
        run: bash scripts/verify-issues.sh
      - name: Verify mutation-waiver registry
        # an earlier decision / L2 (#295): registry-integrity check (stdlib-only, so no uv
        # sync). Fails only on a MALFORMED registry (hard problems); expiry and
        # code-drift are advisory until L6 (#299) turns on --strict.
        run: python3 scripts/mutation_waivers.py

  test:
    if: github.event_name != 'schedule'  # locked/pinned — see lint
    runs-on: ubuntu-latest
    # bug-124: the full suite finishes in seconds; a leaked non-daemon thread once
    # kept the step alive to the 6-HOUR default job limit (burning runner time and
    # masking the failure as "cancelled"). Anything past 15 minutes is a hang.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies (incl. test toolchain)
        run: uv sync --dev --python ${{ matrix.python-version }}
      - name: Run tests
        run: uv run pytest

  wheel-smoke:
    # bug-181: the wheel no longer ships the vendored modules nothing imports.
    # That exclusion is decided in pyproject and checked statically by Gate 13 in
    # the suite, but neither of those installs the artifact — and the failure mode
    # of getting it wrong (an excluded module that IS imported) appears only on a
    # user's machine, as an ImportError, at first use. So this job builds the
    # wheel, installs it into a clean environment with no repository on the path,
    # and imports the server for real.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build the wheel
        run: uv build --wheel -o dist
      - name: Install it into a clean environment
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
      - name: Import the installed package (never from the checkout)
        env:
          CPERSONA_EMBEDDING_MODE: none
          CPERSONA_DB_PATH: /tmp/smoke/smoke.db
        # cd /tmp so `import cpersona` cannot resolve to the source tree.
        run: |
          cd /tmp
          /tmp/smoke/bin/python -c "
          import pathlib
          import cpersona, cpersona.server, cpersona.checks, cpersona.checkup
          import cpersona.memory_handlers, cpersona.admin_handlers, cpersona.maintenance_handlers
          vendored = pathlib.Path(cpersona.__file__).parent / '_vendored_mcp_common'
          shipped = sorted(p.name for p in vendored.glob('*.py'))
          print('shipped vendored modules:', shipped)
          assert 'llm_provider.py' not in shipped, 'the exclusion did not take effect'
          print('checks registered:', len(cpersona.checks.HEALTH_CHECK_NAMES))
          "

  mutation-proof:
    # an earlier decision (first increment): the 2.5.2 refactor seams are guarded by
    # scripts/mutation-proof.py, which applies each hand-authored mutation, runs
    # the suite, and asserts the mutant is CAUGHT (or is a documented equivalent
    # mutant). A green suite is not evidence it would go RED on a real regression;
    # this job turns that evidence into a gate. The behaviour-golden differential
    # (scripts/capture-behaviour.py) is already gated by the `test` job — it runs
    # as tests/test_equivalence_252.py under pytest — so it needs no step here.
    #
    # Pinned to 3.13 only to bound cost: the mutations exercise handler logic, not
    # stdlib version edges, so a second Python version would add runtime without
    # adding signal.
    if: github.event_name != 'schedule'  # locked/pinned — see lint
    runs-on: ubuntu-latest
    # The script runs the suite up to ~13 times, but caught mutants fail fast (-x)
    # and every test is bounded by the 60s per-test timeout; local wall time is
    # ~12s. 15 minutes is a generous hang ceiling, matching the `test` job.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies (incl. test toolchain)
        run: uv sync --dev --python 3.13
      - name: Mutation proof (2.5.2 refactor seams)
        run: uv run --frozen python scripts/mutation-proof.py

  mutation-diff:
    # an earlier decision / an earlier decision (L1): ADVISORY, non-blocking mutation testing scoped
    # to the PR's production diff (cosmic-ray + cr-filter-git). It NEVER fails the
    # build — the script always exits 0 and continue-on-error is a second belt —
    # because this lane exists to MEASURE (survivor counts, noise rate, added CI
    # time), not to gate. The blocking flip is a later, deliberate decision (#299
    # / L6) fed by these numbers. Distinct from the mutation-proof job above,
    # which runs hand-authored sentinel mutants and IS blocking.
    #
    # PR-only: a push to master has no meaningful diff base here, and the git
    # filter needs the base branch to scope against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    # cosmic-ray runs the suite once per in-scope mutant; the diff scope + the
    # --cap in the script bound that. 20 minutes is a generous hang ceiling.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the git filter can diff against the base branch.
          fetch-depth: 0
      - name: Ensure base ref is present
        run: git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies (test toolchain + cosmic-ray)
        run: uv sync --group dev --group mutation --python 3.13
      - name: Mutation-diff (advisory)
        env:
          MUTATION_DIFF_BASE: origin/${{ github.base_ref }}
        run: uv run python scripts/mutation-diff.py --json-out mutation-diff-report.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-diff-report
          path: mutation-diff-report.json
          if-no-files-found: warn
