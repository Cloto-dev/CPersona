site_name: CPersona
site_description: >-
  MCP memory server — persistent, searchable memory for Claude and any MCP
  host. Single SQLite file, 3-layer hybrid search, zero LLM dependency.
# The assembler builds this tree more than once -- under its own version path,
# and again at the root when this is the line served there -- and only site_url
# differs between those builds. It is what canonical links and sitemap.xml are
# built from, so it is read from the environment with the published root as the
# default, which is what a plain `mkdocs build` and every local run still get.
site_url: !ENV [MKDOCS_SITE_URL, "https://cloto-dev.github.io/CPersona/"]
repo_url: https://github.com/Cloto-dev/cpersona
repo_name: Cloto-dev/cpersona
edit_uri: edit/master/docs/

theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  # Verified against the installed 9.7.7 build rather than the feature list in
  # the docs: every flag below was found in the theme's own templates or its
  # bundled JS, so none of them is an Insiders-only name that would be read and
  # silently ignored.
  features:
    - navigation.sections
    - navigation.top
    # Breadcrumbs. The nav groups pages three levels deep, and until now a
    # reader who arrived from a search result or an external link had nothing on
    # the page saying which group they had landed in.
    - navigation.path
    # Previous / next at the foot of every page, so the twenty pages can be read
    # as a sequence and not only as a lookup table.
    - navigation.footer
    # The address bar follows the section being read, which makes "link me to
    # the part that says X" work by copying the URL.
    - navigation.tracking
    - content.action.edit
    - content.code.copy
    - search.suggest
    # Highlights the searched terms on the page the reader opens, rather than
    # dropping them at the top of a long page to find it themselves.
    - search.highlight
    # The table of contents scrolls to keep the current section in view.
    - toc.follow
  #
  # navigation.instant is deliberately NOT enabled. Instant loading swaps the
  # document without re-running scripts in the head, and the language routing in
  # overrides/main.html is exactly that: an inline head script carrying
  # per-page alternates rendered by the template. It would keep working on first
  # load and quietly stop on every navigation after it — and check-lang-routing.js
  # models first-load behaviour, so the gate would stay green while it broke.
  # Turning it on means moving the router onto the theme's document$ observable
  # first, and extending that check to cover the instant path.

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: ja
          name: 日本語
          build: true
          nav_translations:
            Home: ホーム
            Getting Started: はじめに
            Architecture: アーキテクチャ
            Roadmap: ロードマップ
            Reliable Recall (2.6): Reliable Recall (2.6 系)
            Behavior Contracts: 挙動契約
            Tools: ツール一覧
            Operations Runbook: 運用 Runbook
            Configuration: 設定リファレンス
            FAQ: FAQ
            Quality Assurance: 品質保証
            Using CPersona: 使い方
            Operating: 運用
            Project standards: プロジェクト標準
            Sponsorship: 支援について
            Design notes: 設計ノート
            Access and identity: アクセスと同一性
            Retrieval and storage: 検索と保存
            Reliability: 信頼性
            Release lifecycle standard: リリースライフサイクル標準
            # The section heading was translated while the pages under it were
            # not, so the Japanese nav listed English titles under a Japanese
            # header. A nav label is translated here; the page itself is
            # translated by adding <page>.ja.md.
            Per-client capabilities (ACL): クライアント別の権限 (ACL)
            OAuth support: OAuth 対応
            Embedding degradation advisory: 埋め込み劣化の通知
            Server-served operating context: サーバー供給の運用コンテキスト
            Recall preview tier: recall プレビュー階層
            Declared session identity: 申告型セッション同一性
            Recorded access origin: アクセス元の記録
            Contiguous embedding index: 埋め込み索引の連続配置
            Reach and recency in the scan window: 走査窓の到達範囲と新しさの優遇
            Reach, recency and the far vote: 到達範囲・新しさ・far の票
            Policy block standard: ポリシーブロック標準
            SuperAuditor standard: SuperAuditor 標準

# The "Applies to: CPersona <line>" banner the pages open with is derived, not
# written: this hook puts the line the tree states it is on where each page asks
# for it, while the page is still markdown. It is a hook rather than a plugin
# because the assembler builds each line from its own branch with only the two
# pinned packages installed, and a line's documentation must not need a
# dependency added to build the sentence naming that line.
#
# A build with this key removed still succeeds and publishes the placeholder
# verbatim. scripts/check-version-selector.py reads the assembled tree and is
# what makes that red, because nothing in a build can notice it.
hooks:
  - scripts/docs_version.py

# Sidebar sub-category labels only. Kept as a stylesheet rather than an
# override so that the theme keeps owning the markup — this file changes one
# colour, and records why the level above it is left to the theme.
# Version context for the selector rendered in overrides/main.html.
#
# Read from the environment because the assembler builds each line from its own
# branch, and only it knows the whole set -- a branch cannot see the lines beside
# it, and the file that lists them lives on whichever branch drives the assembly.
#
# Material's own version selector is deliberately not enabled (setting
# extra.version would turn it on): it derives its base from the last path segment
# of the URL, so under /2.5/ja/ it reads "ja" as a version name and fetches a
# versions.json that is not there.
#
# All three default to empty, which renders no selector at all -- what a plain
# `mkdocs build` and `mkdocs serve` get, since neither can produce working
# cross-version links anyway.
extra:
  # id|title|flag, separated by ";" -- e.g. "2.5|2.5.x|here;2.6|2.6.x|"
  #
  # Which version this build is travels inside this string rather than in an
  # environment variable of its own, because !ENV parses what it reads as YAML:
  # a bare "2.5" arrives as the float 2.5, and comparing it to the string "2.5"
  # is false forever. The selector still rendered and its links still worked --
  # only the marker saying which version you were reading went missing, which no
  # gate would have caught. Delimiters keep the whole string un-numeric, so it
  # arrives as text.
  doc_versions: !ENV [CPERSONA_DOC_VERSIONS, ""]
  # Absolute root of the published site. Passed rather than derived from
  # site_url: this tree is built both at the root and under its version path, so
  # deriving would need a second, private theory of the URL layout.
  doc_site_root: !ENV [CPERSONA_DOC_SITE_ROOT, ""]

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  # Grid cards on the index page are markdown inside a <div>, which needs this.
  - md_in_html
  # Translated pages carry explicit heading ids ({ #english-slug }) so that a
  # heading rendered in Japanese keeps the anchor its English source generated.
  # Without it, adding a translation silently breaks every cross-page anchor
  # link aimed at that page, because mkdocs --strict does not validate anchors.
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  # Icons in the index page's cards. The tags below are why every script in
  # scripts/ parses this file by hand instead of with yaml.safe_load, which
  # refuses them.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # Diagrams. The blocks these render replaced hand-drawn box art, which could
  # not reflow on a narrow screen and scrolled sideways instead. Note that the
  # theme fetches mermaid from unpkg at view time, so a diagram is the third
  # third-party origin a reader's browser contacts (the other two are the
  # theme's own web fonts) and the one that does not degrade to something
  # readable when it fails.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Grouped by what the reader came to do, not by file kind. The flat list this
# replaced put nine undifferentiated pages above one "Design documents" drawer,
# and the drawer was the fastest-growing part of the site — four pages in the
# twelve days before this regrouping. Two consequences it had: normative
# standards sat beside per-feature rationale, with one of them (the release
# lifecycle) stranded outside the group entirely, and docs/llms.txt fell six
# pages behind without any gate noticing. scripts/check-docs-index.py is the
# detector for the second; this structure is the fix for the first.
#
# Paths are deliberately unchanged. Every published URL is derived from the
# filename, so moving files here would 404 the README's absolute links, the
# PyPI page and every external inbound link, and would touch the ~75 source and
# test comments that cite `docs/<PAGE>.md` as the authority for a behavior.
# Grouping is free of all of that: it is a nav-only change.
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Roadmap: roadmap.md
  - Reliable Recall (2.6): RELIABLE_RECALL_2_6.md
  - Using CPersona:
      - Tools: tools.md
      - Configuration: configuration.md
      - Behavior Contracts: behavior-contracts.md
      - FAQ: faq.md
  - Operating:
      - Operations Runbook: operations.md
      - Quality Assurance: quality-assurance.md
  # Normative: these say what a release, an audit report or a policy block MUST
  # look like, and other repositories adopt them. Kept apart from Design notes,
  # which only explain how this server arrived at one of its own behaviors.
  - Project standards:
      - Release lifecycle standard: RELEASE_LIFECYCLE_STANDARD.md
      - SuperAuditor standard: SUPERAUDITOR_STANDARD.md
      - Policy block standard: CLAUDE_MD_POLICY_STANDARD.md
  # Point-in-time design records, subdivided by subject because the group grows
  # by roughly a page a month and a flat list of ten stops being an index.
  - Design notes:
      - Access and identity:
          - Per-client capabilities (ACL): ACL_DESIGN.md
          - OAuth support: OAUTH_DESIGN.md
          - Server-served operating context: OPERATING_CONTEXT_DESIGN.md
          - Declared session identity: SESSION_IDENTITY_DESIGN.md
          - Recorded access origin: MEMORY_ORIGIN_DESIGN.md
      - Retrieval and storage:
          - Recall preview tier: RECALL_PREVIEW_TIER_DESIGN.md
          - Contiguous embedding index: CONTIGUOUS_INDEX_DESIGN.md
          - Reach and recency in the scan window: SCAN_WINDOW_REACH_DESIGN.md
          - Reach, recency and the far vote: REACH_AND_RECENCY_PLAN.md
      - Reliability:
          - Embedding degradation advisory: DEGRADED_ADVISORY_DESIGN.md
  # Last on purpose: it asks for something, and every page above answers
  # something. A reader looking for how the software works never has to
  # scroll past it.
  - Sponsorship: sponsorship.md
